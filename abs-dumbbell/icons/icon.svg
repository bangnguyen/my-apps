<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2233"/>
      <stop offset="100%" stop-color="#060B12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10E87A"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="120" y1="180" x2="392" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Core Stability Dual Arc Ring -->
  <circle cx="256" cy="256" r="184" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="10"/>
  <path d="M126 126 A184 184 0 0 1 386 126" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M386 386 A184 184 0 0 1 126 386" stroke="#10E87A" stroke-width="14" stroke-linecap="round"/>

  <!-- Single Hex Dumbbell (Diagonal Dynamic Angle) -->
  <g transform="rotate(-18 256 244)">
    <!-- Handle -->
    <rect x="178" y="232" width="156" height="24" rx="12" fill="#E2E8F0"/>
    <rect x="218" y="236" width="76" height="16" rx="8" fill="#94A3B8"/>
    <!-- Left Hex Bell -->
    <rect x="116" y="176" width="66" height="136" rx="22" fill="url(#hexGrad)"/>
    <rect x="128" y="190" width="42" height="108" rx="14" fill="#082032" fill-opacity="0.35"/>
    <!-- Right Hex Bell -->
    <rect x="330" y="176" width="66" height="136" rx="22" fill="url(#hexGrad)"/>
    <rect x="342" y="190" width="42" height="108" rx="14" fill="#082032" fill-opacity="0.35"/>
  </g>

  <!-- 10KG Core Badge Pill -->
  <rect x="166" y="330" width="180" height="56" rx="28" fill="#07131E" stroke="#10E87A" stroke-width="6"/>
  <text x="256" y="369" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5">10 KG</text>

  <!-- Top Core Diamond Spark -->
  <path d="M256 106 L272 134 L256 162 L240 134 Z" fill="#10E87A"/>
</svg>
